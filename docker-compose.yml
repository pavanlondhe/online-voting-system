version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mahavote_postgres
    restart: always
    environment:
      POSTGRES_USER: mahavote_user
      POSTGRES_PASSWORD: mahavote_secure_pass
      POSTGRES_DB: mahavote_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mahavote_user -d mahavote_db']
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: mahavote_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://mahavote_user:mahavote_secure_pass@postgres:5432/mahavote_db?schema=public'
      JWT_SECRET: 'mahavote_production_docker_jwt_secret_key_2026'
      JWT_REFRESH_SECRET: 'mahavote_production_docker_refresh_secret_key_2026'
      CORS_ORIGIN: 'http://localhost:5173'
    ports:
      - '5000:5000'

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: mahavote_client
    restart: always
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  postgres_data:
